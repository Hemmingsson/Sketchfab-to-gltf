name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p 'require("./package.json").version')"
          [ "$tagged" = "$packaged" ] || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version $packaged" >&2
            exit 1
          }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Zip extension
        run: pnpm zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*-chrome.zip
          generate_release_notes: true
          body: |
            ## Install (load unpacked)

            1. Download the `*-chrome.zip` asset below and unzip it.
            2. Open `chrome://extensions` and turn on **Developer mode**.
            3. Click **Load unpacked** and select the unzipped folder (the one that contains `manifest.json`).
