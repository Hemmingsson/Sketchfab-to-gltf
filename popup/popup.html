<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      }
      /* Chrome popups aren't user-resizable via the window chrome, so the app
         box carries `resize` and we remember its size (see popup.js). */
      #app {
        width: 400px;
        min-width: 260px;
        max-width: 780px;   /* under Chrome's ~800px popup cap */
        min-height: 120px;
        max-height: 560px;
        box-sizing: border-box;
        resize: both;
        overflow: auto;
      }
      h3 { margin: 0; padding: 10px; font-size: 13px; font-weight: 600; }
      /* Full-width separators between list items (border spans the whole box;
         horizontal padding lives on the content, not the border). */
      details { border-top: 1px solid GrayText; padding: 8px 10px; }
      summary { cursor: pointer; list-style: none; }
      summary::-webkit-details-marker { display: none; }
      .name { font-size: 12px; }
      .log {
        font-size: 11px; color: GrayText;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      /* Full-width progress; green on done, red on error. */
      progress { display: block; width: 100%; height: 8px; margin: 6px 0; }
      progress.done { accent-color: #2ea043; }
      progress.error { accent-color: #d1242f; }
      a, button { font-family: inherit; font-size: 14px; }
      pre { max-height: 25em; overflow: auto; white-space: pre-wrap; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app">
      <h3>Downloads</h3>
      <div id="list"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
